services:

  proxy:
    image: traefik:v3.7
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      # Enable Traefik for this service
      - traefik.enable=true
      # Route HTTP traffic for the Adminer subdomain
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      # Define the port inside of the Docker service to use
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  backend:
    image: backend:latest
    volumes: &app-volumes
      - app-upload-data:/app/storage
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment: &app-environment
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5178}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SENTRY_DSN: ${SENTRY_DSN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}

      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-}
      ZHIPUAI_EMBEDDING_BASE_URL: ${ZHIPUAI_EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      ZHIPUAI_EMBEDDING_MODEL: ${ZHIPUAI_EMBEDDING_MODEL:-embedding-3}

      CHROMA_PERSIST_DIRECTORY: /app/storage/chroma
      DOCUMENT_STORAGE_DIR: /app/storage/documents

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/utils/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

  # Run `docker compose run --rm prestart` before starting API/worker.
  # Migrations stay outside API lifespans so replicas cannot race on DDL.
  prestart:
    image: backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-environment
    volumes: *app-volumes
    command: ["bash", "scripts/prestart.sh"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["setup"]

  worker:
    image: backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-environment
    volumes: *app-volumes
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-db-data:
  app-upload-data:
